<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Tactical Player Silhouette & Badge for KSCERATO -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B1F"/>
      <stop offset="100%" stop-color="#0B0E0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00B372"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bgGrad)"/>
  <!-- Tactical Grid Lines -->
  <line x1="0" y1="25" x2="100" y2="25" stroke="#1B2226" stroke-width="0.5"/>
  <line x1="0" y1="50" x2="100" y2="50" stroke="#1B2226" stroke-width="0.5"/>
  <line x1="0" y1="75" x2="100" y2="75" stroke="#1B2226" stroke-width="0.5"/>
  <line x1="25" y1="0" x2="25" y2="100" stroke="#1B2226" stroke-width="0.5"/>
  <line x1="50" y1="0" x2="50" y2="100" stroke="#1B2226" stroke-width="0.5"/>
  <line x1="75" y1="0" x2="75" y2="100" stroke="#1B2226" stroke-width="0.5"/>
  <!-- Player Silhouette Outline -->
  <circle cx="50" cy="38" r="18" fill="#1F292E" stroke="#37474F" stroke-width="1.5"/>
  <path d="M22 88 C22 66 34 58 50 58 C66 58 78 66 78 88 Z" fill="#1F292E" stroke="#37474F" stroke-width="1.5"/>
  <!-- FURIA Panther Mini Badge on Jersey -->
  <circle cx="50" cy="74" r="6" fill="#0E1214" stroke="#00FFA3" stroke-width="1"/>
  <text x="50" y="77" font-family="monospace" font-size="6" font-weight="bold" fill="#00FFA3" text-anchor="middle">FUR</text>
  <!-- Tactical Crosshair Headshot Dot -->
  <circle cx="50" cy="38" r="2" fill="#00FFA3"/>
  <!-- Initials HUD Badge -->
  <rect x="28" y="86" width="44" height="12" rx="2" fill="#0E1214" stroke="#00FFA3" stroke-width="1"/>
  <text x="50" y="95" font-family="monospace" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">KSCERATO</text>
</svg>

